[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paymentpulse"
version = "1.0.0"
description = "End-to-End Payments Analytics & Data Quality Platform (Tier 1)"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0.0",
    "faker>=24.0.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
]
mlops = [
    "mlflow>=3.15,<4",
]
aws = [
    "boto3>=1.34",
    "sagemaker>=2.240",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
